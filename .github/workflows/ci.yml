name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pinned Corepack pnpm
        run: |
          corepack enable
          test "$(pnpm --version)" = "11.24.0"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Run unit tests
        run: pnpm test

      - name: Build OpenNext Worker
        run: pnpm build

  database:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Start local Supabase
        run: supabase start

      - name: Reset schema from committed migrations
        run: supabase db reset

      - name: Run pgTAP security tests
        run: supabase test db

  e2e:
    runs-on: ubuntu-latest
    needs: [quality, database]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pinned Corepack pnpm
        run: |
          corepack enable
          test "$(pnpm --version)" = "11.24.0"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Workers-runtime E2E
        run: pnpm test:e2e:workers

  lighthouse:
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pinned Corepack pnpm
        run: |
          corepack enable
          test "$(pnpm --version)" = "11.24.0"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Lighthouse drives a real browser; reuse the Playwright Chromium build
      # rather than depending on whatever Chrome the runner image ships.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run the Lighthouse gate
        run: pnpm lighthouse

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci
          # `.lighthouseci` is dot-prefixed and the action skips hidden paths by
          # default, so this step ran on every failed gate and uploaded nothing.
          # Requirement 9.5 needs the reports retained, and the first failing run
          # had to be diagnosed from job logs because they were not.
          include-hidden-files: true
          # A gate that produced no report is a broken gate, not a warning.
          if-no-files-found: error
          retention-days: 30
